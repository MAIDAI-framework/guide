name: Update Guide contact

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-contact:
    if: github.event.head_commit.message == 'Temporary workflow to update Guide contact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace public contact address
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Guide.md')
          s = p.read_text(encoding='utf-8')
          old = '[meri.black.maidai@gmail.com](mailto:meri.black.maidai@gmail.com)'
          new = '[mercury.black.maidai@outlook.com](mailto:mercury.black.maidai@outlook.com)'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one old contact entry, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit exact contact correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Guide.md
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'Update public contact email'
          git push
