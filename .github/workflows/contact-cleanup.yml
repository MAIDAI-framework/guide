name: Update public contact

on:
  push:
    paths:
      - '.github/workflows/contact-cleanup.yml'

permissions:
  contents: write

jobs:
  update-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove inactive Colony contact
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Guide.md')
          text = p.read_text(encoding='utf-8')
          old = '- **Contact and companion materials:** [mercury.black.maidai@outlook.com](mailto:mercury.black.maidai@outlook.com) — or DM `magdalene-black` on The Colony (thecolony.cc).  '
          new = '- **Contact and companion materials:** [mercury.black.maidai@outlook.com](mailto:mercury.black.maidai@outlook.com)  '
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one old contact line, found {count}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Guide.md
          git commit -m 'Remove inactive Colony contact'
          git push